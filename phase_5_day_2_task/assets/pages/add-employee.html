<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Employee</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/employee-form.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="container py-4">
      <div class="page-header">
        <div>
          <h1 class="page-title">Add Employee</h1>

          <p class="page-subtitle">Create a new employee record</p>
        </div>

        <a href="employees.html" class="btn btn-outline-secondary">
          Back to Dashboard
        </a>
      </div>

      <div class="employee-form-card">
        <div class="card">
          <div class="card-body">
            <form id="employeeForm">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label"> Employee Name </label>

                  <input type="text" id="employeeName" class="form-control" />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Role </label>

                  <input type="text" id="employeeRole" class="form-control" />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Salary </label>

                  <input
                    type="number"
                    id="employeeSalary"
                    class="form-control"
                  />
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label"> Email </label>

                  <input type="email" id="employeeEmail" class="form-control" />
                </div>
              </div>

              <div id="employeeMessage" class="mb-3"></div>

              <button type="submit" class="btn btn-primary">
                Save Employee
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/auth.js"></script>

  </body>
</html>
