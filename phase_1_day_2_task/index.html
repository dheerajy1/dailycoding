<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #333333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #007bff;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid #cccccc;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

    </style>

</head>
<body>

    <h1>Student Details Table</h1>

    <table>

        <tr>
            <th>Name</th>
            <th>Course</th>
            <th>Mobile Number</th>
            <th>Email</th>
        </tr>

        <tr>
            <td>John</td>
            <td>React JS</td>
            <td>9876543210</td>
            <td>john@example.com</td>
        </tr>

        <tr>
            <td>Dheeraj</td>
            <td>Frontend Development</td>
            <td>9123456780</td>
            <td>dheeraj@example.com</td>
        </tr>

    </table>

</body>
</html>
