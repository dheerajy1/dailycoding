<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory Application</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/usercards.css" />
    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body>
    <header class="py-4 mb-4 text-center header-section">
      <h1 class="fw-bold">User Directory</h1>
      <p class="text-muted">Real-time team management portal</p>
    </header>

    <main class="container my-4">
      <div id="loading-state" class="text-center d-none">
        <div class="spinner-border spinner-custom" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-2 state-text-loading">Fetching user directory data...</p>
      </div>

      <div
        id="error-state"
        class="alert alert-danger text-center d-none"
        role="alert"
      >
        <h4 class="alert-heading fw-bold">Connection Error</h4>
        <p id="error-message" class="mb-0">
          Failed to load directory details. Please try again later.
        </p>
      </div>

      <div id="user-grid" class="row g-4"></div>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
