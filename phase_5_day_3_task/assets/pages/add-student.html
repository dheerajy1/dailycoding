<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Student</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container py-4">
      <h2 class="mb-4">Add Student</h2>

      <form id="studentForm">
        <div class="mb-3">
          <input
            type="text"
            id="studentName"
            class="form-control"
            placeholder="Student Name"
          />
        </div>

        <div class="mb-3">
          <input
            type="email"
            id="studentEmail"
            class="form-control"
            placeholder="Student Email"
          />
        </div>

        <div class="mb-3">
          <input
            type="text"
            id="studentCourse"
            class="form-control"
            placeholder="Course"
          />
        </div>

        <div id="studentMessage" class="mb-3"></div>

        <button class="btn btn-success">Save Student</button>

        <a href="dashboard.html" class="btn btn-secondary">Back</a>
      </form>
    </div>

    <script type="module" src="../../assets/js/main.js"></script>
  </body>
</html>
