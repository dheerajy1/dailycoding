<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management System</title>

    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="assets/css/form.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/records.css" />

    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body>
    <!-- =========================================================================
        SECTION 1: Main
    ========================================================================== -->
    <main class="app-container">
      <!-- =========================================================================
        SECTION 2: Form
    ========================================================================== -->
      <section class="form-panel">
        <h2>Add New Employee</h2>
        <form id="employeeForm">
          <div class="field-group">
            <label for="empName">Full Name</label>
            <input
              type="text"
              id="empName"
              placeholder="e.g. John Doe"
              required
            />
          </div>
          <div class="field-group">
            <label for="empRole">Job Designation</label>
            <input
              type="text"
              id="empRole"
              placeholder="e.g. Frontend Developer"
              required
            />
          </div>
          <div class="field-group">
            <label for="empSalary">Annual Salary ($)</label>
            <input
              type="number"
              id="empSalary"
              placeholder="e.g. 50000"
              required
            />
          </div>
          <button type="submit" class="btn-submit">Add Employee</button>
        </form>
      </section>

      <!-- =========================================================================
        SECTION 2: Data table
    ========================================================================== -->
      <section class="data-panel">
        <div class="metrics-grid">
          <div class="metric-card">
            <h3>Total Staff</h3>
            <p id="totalStaff">0</p>
          </div>
          <div class="metric-card">
            <h3>Payroll Budget</h3>
            <p id="totalPayroll">$0</p>
          </div>
        </div>

        <div class="records-container">
          <h2>Employee Directory</h2>
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Role</th>
                  <th>Salary</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="employeeTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
