<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management System</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/employee-form.css" />
    <link rel="stylesheet" href="../css/employee-table.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <div class="container py-4">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">Employee Management System</h1>

          <p class="dashboard-subtitle">
            Manage employee records and operations
          </p>
        </div>

        <div class="dashboard-actions">
          <a href="add-employee.html" class="btn btn-primary"> Add Employee </a>

          <button id="logoutBtn" class="btn btn-outline-danger">Logout</button>
        </div>
      </div>

      <section class="stats-section">
        <div class="row g-4">
          <div class="col-lg-3 col-md-6">
            <div class="stats-card">
              <h5>Total Employees</h5>
              <h2 id="totalEmployees">0</h2>
            </div>
          </div>

          <div class="col-lg-3 col-md-6">
            <div class="stats-card">
              <h5>Total Salary</h5>
              <h2 id="totalSalary">₹0</h2>
            </div>
          </div>

          <div class="col-lg-3 col-md-6">
            <div class="stats-card">
              <h5>Roles</h5>
              <h2 id="totalRoles">0</h2>
            </div>
          </div>

          <div class="col-lg-3 col-md-6">
            <div class="stats-card">
              <h5>Records</h5>
              <h2 id="totalRecords">0</h2>
            </div>
          </div>
        </div>
      </section>

      <section class="employee-table-section">
        <div class="card">
          <div class="card-body">
            <h3 class="mb-4">Employee Records</h3>

            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Salary</th>
                    <th>Email</th>
                    <th>Actions</th>
                  </tr>
                </thead>

                <tbody id="employeeTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script src="../js/script.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
