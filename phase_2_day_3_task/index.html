<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SaaS Admin Dashboard</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/header.css" />
    <link rel="stylesheet" href="./assets/css/sidebar.css" />
    <link rel="stylesheet" href="./assets/css/dashboard.css" />
    <link rel="stylesheet" href="./assets/css/users.css" />
    <link rel="stylesheet" href="./assets/css/notifications.css" />
    <link rel="stylesheet" href="./assets/css/settings.css" />
    <link rel="stylesheet" href="./assets/css/responsive.css" />
  </head>

  <body>
    <div class="dashboard-wrapper">
      <!-- Admin Sidebar -->
      <aside class="sidebar">
        <h3 class="sidebar-logo">AdminPanel</h3>

        <nav class="sidebar-nav">
          <a href="#" class="sidebar-link">Dashboard</a>
          <a href="#" class="sidebar-link">Analytics</a>
          <a href="#" class="sidebar-link">Users</a>
          <a href="#" class="sidebar-link">Tasks</a>
          <a href="#" class="sidebar-link">Revenue</a>
          <a href="#" class="sidebar-link">Settings</a>
          <a href="#" class="sidebar-link">Logout</a>
        </nav>
      </aside>

      <!-- Main section -->
      <main class="main-content">
        <!-- Header section -->
        <header class="dashboard-header">
          <h2 class="dashboard-title">Dashboard</h2>

          <div class="header-actions">
            <input
              type="text"
              class="form-control header-search"
              placeholder="Search..."
            />

            <button class="btn btn-outline-secondary">🔔</button>

            <div class="header-profile">Admin</div>
          </div>
        </header>
        <!-- Dashboard -->
        <section class="dashboard-overview">
          <div class="overview-card">
            <h6>Total Users</h6>
            <h3>2,540</h3>
          </div>

          <div class="overview-card">
            <h6>Revenue</h6>
            <h3>$48,200</h3>
          </div>

          <div class="overview-card">
            <h6>Projects</h6>
            <h3>128</h3>
          </div>

          <div class="overview-card">
            <h6>Tasks</h6>
            <h3>342</h3>
          </div>
        </section>
      </main>
    </div>
  </body>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</html>
