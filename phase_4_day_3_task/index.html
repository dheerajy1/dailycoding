<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Web Application</title>

    <link rel="stylesheet" href="assets/css/style.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./assets/js/tailwindconfig.js"></script>
  </head>
  <body class="bg-surface text-txt-main min-h-screen py-10 px-4">
    <main class="max-w-4xl mx-auto space-y-8">
      <section
        class="bg-card p-8 rounded-main shadow-subtle border border-borderline"
      >
        <div class="mb-6">
          <h2 class="text-2xl font-bold text-txt-main">Student Registration</h2>
          <p class="text-txt-muted text-sm mt-1">
            Provide student credentials to enroll in the persistent ledger.
          </p>
        </div>

        <div
          id="statusMessage"
          class="hidden mb-6 p-4 rounded-input text-sm font-medium"
        ></div>

        <form
          id="registrationForm"
          novalidate
          class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4"
        >
          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-txt-main mb-1.5"
              >Full Name</label
            >
            <input
              type="text"
              id="studentName"
              class="w-full border border-borderline rounded-input p-2.5 text-txt-main focus:outline-none focus:border-brand transition"
              placeholder="Enter student's full name"
            />
            <p id="nameError" class="text-danger text-xs mt-1.5 hidden"></p>
          </div>

          <div class="col-span-1">
            <label class="block text-sm font-semibold text-txt-main mb-1.5"
              >Email Address</label
            >
            <input
              type="email"
              id="studentEmail"
              class="w-full border border-borderline rounded-input p-2.5 text-txt-main focus:outline-none focus:border-brand transition"
              placeholder="name@domain.com"
            />
            <p id="emailError" class="text-danger text-xs mt-1.5 hidden"></p>
          </div>

          <div class="col-span-1">
            <label class="block text-sm font-semibold text-txt-main mb-1.5"
              >Mobile Number</label
            >
            <input
              type="tel"
              id="studentMobile"
              class="w-full border border-borderline rounded-input p-2.5 text-txt-main focus:outline-none focus:border-brand transition"
              placeholder="10-digit number"
            />
            <p id="mobileError" class="text-danger text-xs mt-1.5 hidden"></p>
          </div>

          <div class="md:col-span-2">
            <label class="block text-sm font-semibold text-txt-main mb-1.5"
              >Account Password</label
            >
            <input
              type="password"
              id="studentPassword"
              class="w-full border border-borderline rounded-input p-2.5 text-txt-main focus:outline-none focus:border-brand transition"
              placeholder="Min. 6 characters"
            />
            <p id="passwordError" class="text-danger text-xs mt-1.5 hidden"></p>
          </div>

          <div class="md:col-span-2 pt-2">
            <button
              type="submit"
              class="w-full bg-brand hover:bg-brand-hover text-white font-bold py-3 rounded-input transition duration-200 shadow-sm"
            >
              Register Student Profile
            </button>
          </div>
        </form>
      </section>

      <section
        class="bg-card rounded-main shadow-subtle border border-borderline overflow-hidden"
      >
        <div
          class="p-6 border-b border-borderline flex justify-between items-center"
        >
          <h2 class="text-xl font-bold text-txt-main">
            Registered Students Ledger
          </h2>
          <span
            class="bg-surface text-txt-muted text-xs font-bold px-3 py-1 rounded-full border border-borderline"
            >Live Records</span
          >
        </div>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-surface/50">
                <th
                  class="p-4 text-xs font-bold uppercase tracking-wider text-txt-muted border-b border-borderline"
                >
                  Student Name
                </th>
                <th
                  class="p-4 text-xs font-bold uppercase tracking-wider text-txt-muted border-b border-borderline"
                >
                  Email Identity
                </th>
                <th
                  class="p-4 text-xs font-bold uppercase tracking-wider text-txt-muted border-b border-borderline"
                >
                  Mobile Contact
                </th>
                <th
                  class="p-4 text-xs font-bold uppercase tracking-wider text-txt-muted border-b border-borderline text-center"
                >
                  Operational Action
                </th>
              </tr>
            </thead>
            <tbody
              id="studentTableBody"
              class="divide-y divide-borderline"
            ></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
