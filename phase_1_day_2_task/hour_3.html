<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
        }

        .main-container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
            display: flex;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
        }

        .left-panel {
            width: 40%;
            background-color: #007bff;
            color: white;
            padding: 50px 35px;
        }

        .left-panel h1 {
            margin-top: 0;
            font-size: 36px;
        }

        .left-panel p {
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .course-list {
            padding-left: 20px;
        }

        .course-list li {
            margin-bottom: 12px;
        }

        .right-panel {
            width: 60%;
            padding: 50px 40px;
        }

        .right-panel h2 {
            margin-top: 0;
            color: #333333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444444;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .gender-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: normal;
        }

        .gender-group input {
            width: auto;
        }

        button {
            width: 100%;
            background-color: #007bff;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

    </style>

</head>
<body>

    <div class="main-container">

        <div class="left-panel">

            <h1>KT Academy</h1>

            <p>
                Join our professional frontend development training program
                and improve your HTML, CSS, JavaScript, Bootstrap, and React skills.
            </p>

            <h3>Courses Offered</h3>

            <ul class="course-list">
                <li>Frontend Development</li>
                <li>React JS</li>
                <li>Full Stack Development</li>
                <li>UI/UX Basics</li>
            </ul>

        </div>

        <div class="right-panel">

            <h2>Student Registration Form</h2>

            <form>

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Enter full name"
                    >

                </div>

                <div class="form-group">

                    <label>Email Address</label>

                    <input
                        type="email"
                        placeholder="Enter email address"
                    >

                </div>

                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        placeholder="Enter phone number"
                    >

                </div>

                <div class="form-group">

                    <label>Gender</label>

                    <div class="gender-group">

                        <label>
                            <input type="radio" name="gender">
                            Male
                        </label>

                        <label>
                            <input type="radio" name="gender">
                            Female
                        </label>

                    </div>

                </div>

                <div class="form-group">

                    <label>Select Course</label>

                    <select>

                        <option>
                            Frontend Development
                        </option>

                        <option>
                            React JS
                        </option>

                        <option>
                            Full Stack Development
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>Address</label>

                    <textarea
                        placeholder="Enter your address"
                    ></textarea>

                </div>

                <button type="submit">
                    Register Student
                </button>

            </form>

        </div>

    </div>

</body>
</html>
