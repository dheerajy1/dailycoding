<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./assets/css/style.css" />
  </head>

  <body>
    <div class="container py-5">
      <!-- HERO SECTION -->
      <div class="text-center mb-5">
        <h1 class="display-4 fw-bold">Student Dashboard System</h1>

        <p class="lead text-muted">
          Manage students, track records, and handle data efficiently.
        </p>

        <a href="./login.html" class="btn btn-primary btn-lg mt-3">
          Login to Dashboard
        </a>
      </div>

      <!-- FEATURE CARDS -->
      <div class="row g-4">
        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5>Student Management</h5>
              <p class="text-muted">
                Add, edit, and delete student records easily.
              </p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5>Session Storage</h5>
              <p class="text-muted">
                Secure login sessions using browser storage.
              </p>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card h-100">
            <div class="card-body text-center">
              <h5>Modular JS</h5>
              <p class="text-muted">
                Clean architecture using JavaScript modules.
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
