<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Employee - Dashboard</title>

    <!-- AdminLTE CSS -->
    <link rel="stylesheet" href="../../css/adminlte.min.css" />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="app-wrapper">
    <div class="app-main p-3">
      <!-- Page Header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Add Employee</h3>
        <p class="text-muted">
          Create new employee and store using LocalStorage API
        </p>

        <a href="./list.html" class="nav-link">
          <button class="btn btn-primary">
            <i class="bi"></i> Show Employee
          </button>
        </a>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <!-- Employee Form -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Employee Name</label>
              <input
                type="text"
                id="empName"
                class="form-control"
                placeholder="Enter name"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Role</label>
              <select id="empRole" class="form-select">
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
              </select>
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input
                type="email"
                id="empEmail"
                class="form-control"
                placeholder="Enter email"
              />
            </div>

            <div class="col-md-6 mb-3">
              <label class="form-label">Status</label>
              <select id="empStatus" class="form-select">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>
            </div>
          </div>

          <button class="btn btn-success" onclick="saveEmployee()">
            <i class="bi bi-save"></i> Save Employee
          </button>
        </div>
      </div>
    </div>

    <script>
      // ✅ LocalStorage CRUD (MANDATORY API FEATURE)

      function saveEmployee() {
        const name = document.getElementById("empName").value;
        const role = document.getElementById("empRole").value;
        const email = document.getElementById("empEmail").value;
        const status = document.getElementById("empStatus").value;

        if (!name || !email) {
          alert("Please fill required fields");
          return;
        }

        let employees = JSON.parse(localStorage.getItem("employees")) || [];

        const newEmployee = {
          id: "EMP" + (employees.length + 1),
          name,
          role,
          email,
          status,
        };

        employees.push(newEmployee);

        localStorage.setItem("employees", JSON.stringify(employees));

        alert("Employee saved successfully!");

        // clear form
        document.getElementById("empName").value = "";
        document.getElementById("empEmail").value = "";
      }
    </script>
    <script src="../../custom/js/theme.js"></script>
  </body>
</html>
