<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Result Management System</title>

    <link rel="stylesheet" href="assets/css/style.css" />

    <link rel="stylesheet" href="assets/css/dashboard.css" />
    <link rel="stylesheet" href="assets/css/form.css" />
    <link rel="stylesheet" href="assets/css/records.css" />

    <link rel="stylesheet" href="assets/css/responsive.css" />
  </head>
  <body>
    <!-- ==========================================================================
           SECTION 1: Main
           ========================================================================== -->
    <main class="dashboard-container">
      <!-- ==========================================================================
           SECTION 2: Header
           ========================================================================== -->
      <header class="dashboard-header">
        <h1>Student Result Management</h1>
        <p>
          Enter details to calculate grades and manage records in real-time.
        </p>
      </header>

      <!-- ==========================================================================
           SECTION 3: Form
           ========================================================================== -->
      <section class="form-section">
        <form id="studentForm">
          <div class="form-group">
            <label for="studentName">Student Name</label>
            <input
              type="text"
              id="studentName"
              required
              placeholder="Enter student name"
            />
          </div>
          <div class="form-group">
            <label for="studentMarks">Marks (0 - 100)</label>
            <input
              type="number"
              id="studentMarks"
              min="0"
              max="100"
              required
              placeholder="Enter marks"
            />
          </div>
          <div class="form-group">
            <label for="studentAttendance">Attendance (%)</label>
            <input
              type="number"
              id="studentAttendance"
              min="0"
              max="100"
              required
              placeholder="Enter attendance percentage"
            />
          </div>
          <button type="submit" id="submitBtn">Add Student Record</button>
        </form>
      </section>

      <!-- ==========================================================================
           SECTION 3: Table
           ========================================================================== -->
      <section class="results-section">
        <h2>Data Log & Performance Records</h2>
        <div class="table-wrapper">
          <table id="resultsTable">
            <thead>
              <tr>
                <th>Student Name</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Attendance</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="assets/js/script.js"></script>
  </body>
</html>
